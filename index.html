<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map screenshotter</title>
    <style>
      html { background: #f7f7f5; }
      html[data-theme="dark"] { background: #191919; }
      html:not([data-ui-ready]) .app-shell { visibility: hidden; }
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem("mapbox-screenshotter-theme");
        document.documentElement.dataset.theme = savedTheme ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div class="control-panel">
        <header class="panel-header">
          <h1 data-i18n="appTitle">map screenshotter</h1>
          <div class="header-actions">
            <button type="button" id="themeButton" class="theme-button" aria-label="Switch color theme">
              <span class="theme-button-label">Dark</span>
            </button>
            <details class="language-menu">
              <summary aria-label="Choose language" title="Choose language">
                <img src="./language.svg" alt="" aria-hidden="true" />
              </summary>
              <div class="language-menu-options" role="group" aria-label="Choose language">
                <button type="button" data-language="en">English</button>
                <button type="button" data-language="ru">Русский</button>
              </div>
            </details>
          </div>
        </header>

        <form id="controls" class="controls">
          <section class="control-section">
            <div class="field-grid map-fields">
              <label class="field field-coordinate">
                <span data-i18n="longitude">Longitude</span>
                <input id="lngInput" name="lng" type="number" step="0.0001" />
              </label>
              <label class="field field-coordinate">
                <span data-i18n="latitude">Latitude</span>
                <input id="latInput" name="lat" type="number" step="0.0001" />
              </label>
              <label class="field field-zoom">
                <span data-i18n="zoom">Zoom</span>
                <input id="zoomInput" name="zoom" type="number" step="0.5" min="0" max="24" />
              </label>
              <label class="field field-rotation">
                <span data-i18n="rotation">Rotation</span>
                <span class="unit-input">
                  <input id="bearingInput" name="bearing" type="number" step="1" />
                  <span class="unit-input-suffix">°</span>
                </span>
              </label>
              <label class="field field-png-size">
                <span data-i18n="pngSize">PNG size</span>
                <span class="unit-input">
                  <input id="sizeInput" name="size" type="number" min="128" max="8192" step="10" />
                  <span class="unit-input-suffix">px</span>
                </span>
              </label>
            </div>

          </section>

          <div class="output-group">
            <section class="name-controls" aria-label="PNG name suggestion" data-i18n-aria-label="pngNameSuggestion">
              <span class="name-controls-title" data-i18n="suggestedName">Suggested name</span>
              <div class="name-controls-row">
                <label class="name-toggle" title="Use the selected nearby place in the PNG filename" data-i18n-title="useSuggestedNameTitle">
                  <input id="nameToggle" type="checkbox" role="switch" checked />
                  <span class="toggle-track" aria-hidden="true"><span></span></span>
                  <span class="sr-only" data-i18n="useSuggestedName">Use suggested PNG name</span>
                </label>
                <label class="name-select-label" id="nameSelectLabel">
                  <span class="sr-only" data-i18n="nearbyPlaceName">Nearby place name</span>
                  <select id="nameSelect" aria-label="Nearby place name" data-i18n-aria-label="nearbyPlaceName">
                    <option value="" data-i18n-suggestion-message="findingNearbyNames">Finding nearby names...</option>
                  </select>
                  <input id="nameInput" aria-label="Custom PNG name" data-i18n-aria-label="customPngName" hidden />
                  <span class="name-loading-spinner" aria-label="Finding nearby names" data-i18n-aria-label="findingNearbyNames" role="status"></span>
                </label>
                <button
                  type="button"
                  id="nameEditButton"
                  class="name-edit-button"
                  aria-label="Edit suggested name"
                  title="Edit suggested name"
                  disabled
                >
                  <span class="name-edit-icon name-edit-pencil" aria-hidden="true"></span>
                  <span class="name-edit-icon name-edit-reset" aria-hidden="true"></span>
                </button>
              </div>
            </section>

            <div class="button-row actions">
              <button
                type="button"
                id="screenshotButton"
                class="button button-accent icon-button"
                aria-label="Download PNG"
                title="Download PNG"
              >
                <img src="./square.and.arrow.down.svg" alt="" aria-hidden="true" />
              </button>
              <button
                type="button"
                id="copyButton"
                class="button icon-button"
                aria-label="Copy PNG"
                title="Copy PNG"
              >
                <img src="./document.on.document.svg" alt="" aria-hidden="true" />
              </button>
            </div>
          </div>
        </form>
      </div>

      <main class="preview-shell">
        <div class="stage-scroll">
          <div id="mapViewport" class="map-stage-viewport">
            <div id="mapStage" class="map-stage">
              <div id="map" class="map-canvas"></div>
            </div>
            <div class="canvas-size-controls" aria-label="Canvas size" data-i18n-aria-label="canvasSize">
              <button
                type="button"
                id="expandCanvasButton"
                class="canvas-size-end-button"
                aria-label="Expand canvas by one step"
              >
                <img
                  class="canvas-size-end-icon"
                  src="./arrow.up.left.and.arrow.down.right.svg"
                  alt=""
                  aria-hidden="true"
                />
              </button>
              <label class="canvas-size-slider-label">
                <span class="sr-only" data-i18n="canvasSize">Canvas size</span>
                <span class="canvas-size-track" aria-hidden="true">
                  <span class="canvas-size-fill"></span>
                </span>
                <input
                  id="canvasSizeSlider"
                  class="canvas-size-slider"
                  type="range"
                  min="0"
                  max="23"
                  step="1"
                  value="12"
                  aria-valuetext="960 pixels"
                />
                <span id="canvasSizeDefaultOffset" class="canvas-size-default-offset" aria-hidden="true">
                  <span id="canvasSizeDefaultOffsetSign" class="canvas-size-default-offset-sign"></span>
                  <span id="canvasSizeDefaultOffsetValue">0</span>
                </span>
              </label>
              <span class="canvas-size-default-dot" aria-hidden="true"></span>
              <button
                type="button"
                id="contractCanvasButton"
                class="canvas-size-end-button"
                aria-label="Contract canvas by one step"
              >
                <img
                  class="canvas-size-end-icon"
                  src="./arrow.down.right.and.arrow.up.left.svg"
                  alt=""
                  aria-hidden="true"
                />
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
